name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      force-full-run:
        description: 'Force a full try run'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide-runs:
    name: Decision task
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      rust-changed: ${{ steps.set-flags.outputs.rust-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: full-ci
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            title=$(gh pr view "$PR_NUMBER" --json title -q '.title')
            echo "PR number: ${PR_NUMBER}"
            echo "PR title: ${title}"
            if echo "$title" | grep -q '\[full ci\]'; then
              echo "full-ci=true" >> $GITHUB_OUTPUT
            fi
          fi
      - id: changed-files-rust
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            **/Cargo.toml
            **/Cargo.lock
            **/*.rs
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Show state
        env:
          FULL_CI: ${{ steps.full-ci.outputs.full-ci }}
          FORCE_RUN: ${{ github.event.inputs.force-full-run }}
          REF_NAME: ${{ github.ref_name == 'main' }}
          RUST_CHANGED: ${{ steps.changed-files-rust.outputs.any_changed }}
          FULL: ${{ steps.full-ci.outputs.full-ci || github.event.inputs.force-full-run || github.ref_name == 'main' || steps.changed-files-rust.outputs.any_changed }}
        run: |
          echo "full-ci=$FULL_CI"
          echo "force-run=$FORCE_RUN"
          echo "ref-name=$REF_NAME"
          echo "rust-changed=$RUST_CHANGED"
          echo "full=$FULL"

      - name: Decide which jobs to run
        id: set-flags
        env:
          RUST_CHANGED: ${{ steps.full-ci.outputs.full-ci || github.event.inputs.force-full-run || github.ref_name == 'main' || steps.changed-files-rust.outputs.any_changed }}
        run: |
          echo "rust-changed=$RUST_CHANGED" >> $GITHUB_OUTPUT

  test-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - run: rustc -vV
